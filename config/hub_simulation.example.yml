# FILE VÍ DỤ — B CHỐT / C ĐỒNG BỘ GENERATOR TRƯỚC KHI TRIỂN KHAI
# KHÔNG chứa thông tin bí mật.
contract_version: "1.1"  # B soạn ở bản 1.0; C cập nhật theo HUB_DATA_CONTRACT v1.1 trên main
rules_version: "hub-scenario-v1"
seed: 20261113

source:
  reference_path: "data/hub/pickup_reference.csv"
  cities: ["JILIN", "YANTAI"]
  target_per_city: 2500
  filter_quality_status: "VALID"
  max_completion_exclusive: "2022-12-25T00:00:00"

scenario:
  as_of_ts: "2022-12-31T23:59:59"
  hubs_per_city: 2
  # TẤT CẢ shipment trong phiên bản MVP có đủ 3 event.
  event_types:
    - HUB_RECEIVED
    - SORTING_COMPLETED
    - HUB_DEPARTED
  delays_hours: # GIẢ ĐỊNH TEST, không phải dữ liệu thực tế
    pickup_to_received: [0.5, 8.0]
    received_to_sorted: [0.25, 12.0]
    sorted_to_departed: [0.25, 24.0]

batching:
  # Sau khi sinh event, sort (event_ts,event_id), chia batch tăng dần.
  event_rows_per_batch: 5000
  batch_id_prefix: "HUB-V1-B"

output:
  directory: "data/hub/generated"
  encoding: "utf-8"
  newline: LF
  datetime_format: "%Y-%m-%dT%H:%M:%S"
  data_origin: "SIMULATED"
